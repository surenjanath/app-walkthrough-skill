<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head>
<body style="position:relative;">
  <div class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" fill="#fff"/></svg></div>
      <div class="brand-name">Acme Rewards</div>
    </div>
    <div class="side-link">▦ Dashboard</div>
    <div class="side-link active">🏷 Offers</div>
    <div class="side-link">📊 Activity</div>
    <div class="side-link">⚙ Settings</div>
  </div>

  <div class="topbar">
    <div style="font-weight:700;font-size:20px;color:#1F2340;">Offers</div>
    <div class="card" style="padding:14px 26px;border:2px solid #ECEDF3;box-shadow:none;font-family:Arial;color:#B4B6C6;font-size:16px;width:340px;">🔍 Search offers</div>
  </div>

  <div class="content" style="font-family:Arial,sans-serif;">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px;">
      <div class="card" style="padding:32px;grid-column:span 3;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;">
        <div style="color:#FCD34D;font-size:14px;font-weight:800;letter-spacing:2px;">★ FLAGSHIP PARTNER</div>
        <div style="font-size:28px;font-weight:700;margin-top:10px;">Riverside Grand Hotel — 15% off rooms, 10% off dining</div>
      </div>
      <div class="card" style="padding:30px;">
        <div style="width:64px;height:64px;border-radius:16px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:28px;color:#4F46E5;font-weight:800;">B</div>
        <div style="font-weight:700;font-size:20px;color:#1F2340;margin-top:20px;">Bloom Coffee Co.</div>
        <div style="color:#16A34A;font-weight:700;font-size:16px;margin-top:6px;">Buy one, get one free</div>
      </div>
      <div class="card" style="padding:30px;">
        <div style="width:64px;height:64px;border-radius:16px;background:#FDEEDB;display:flex;align-items:center;justify-content:center;font-size:28px;color:#B45309;font-weight:800;">S</div>
        <div style="font-weight:700;font-size:20px;color:#1F2340;margin-top:20px;">Summit Fitness</div>
        <div style="color:#16A34A;font-weight:700;font-size:16px;margin-top:6px;">20% off membership</div>
      </div>
      <div class="card" style="padding:30px;">
        <div style="width:64px;height:64px;border-radius:16px;background:#DCFCE7;display:flex;align-items:center;justify-content:center;font-size:28px;color:#15803D;font-weight:800;">G</div>
        <div style="font-weight:700;font-size:20px;color:#1F2340;margin-top:20px;">Green Leaf Market</div>
        <div style="color:#16A34A;font-weight:700;font-size:16px;margin-top:6px;">5% off every order</div>
      </div>
    </div>
  </div>
</body></html>
